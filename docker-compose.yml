services:
  postgres:
    image: postgres:16
    container_name: crm-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pedro
      POSTGRES_PASSWORD: pedro
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: